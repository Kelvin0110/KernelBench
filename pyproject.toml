[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# this should be our single source of truth for versioning

[project]
name = "kernelbench"
version = "0.2.0.dev0"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.9.0",

    "transformers",
    "datasets>=2.19.0",
    "modal",

    # helper
    "tqdm",
    "packaging",
    "setuptools",
    "pydra-config",
    "ninja",
    "tomli",
    "tabulate",

    # Numerics
    "einops",
    "python-dotenv",
    "numpy",
    # DBSCAN for L1 skill merging (evolving_common/governor/skill_merge_cluster.py).
    # Must stay a default dependency, not an extra: `uv run`/`uv sync` prune
    # anything not declared here, which silently removes sklearn and makes every
    # --skill-merging iteration die with coder_call_error.
    "scikit-learn",

    # LLM providers
    "openai",
    "litellm[proxy]",
]

[project.optional-dependencies]
aideml = [
    "aideml",
]
evolving-agent = [
    "self-evolving-agent",
    "pandas",
    "scikit-learn",
    "chromadb",
    "pydantic",
    "pyyaml>=6.0.0",
]
gpu = [
    # GPU-specific dependencies (requires CUDA)
    "triton",
    "nvidia-cutlass-dsl",
    "tilelang",
    "cupy-cuda12x",
    "nsight-python",
]
dev = [
    "pytest",
    "ruff",
]
vis = [
    "fastapi",
    "uvicorn",
    "matplotlib",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["kernelbench*"]

[tool.setuptools.package-data]
kernelbench = ["prompts/**/*"]

# PyTorch CUDA index — provides CUDA-enabled wheels for both x86_64 and aarch64
# (e.g. GH200 Grace Hopper). PyPI only ships CPU-only aarch64 wheels for torch.
# CUDA 12.8 is the latest stable series and works with driver >= 520.
# After changing this, regenerate the lockfile: uv lock --upgrade-package torch
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
aideml = { path = "./aideml", editable = true }
self-evolving-agent = { path = "./Self-Evolving-Agent", editable = true }